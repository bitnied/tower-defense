		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#canvas{position:fixed !important;top:0 !important;left:0 !important}
#fs-btn{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));z-index:10;width:42px;height:42px;font-size:22px;line-height:1;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.4);border-radius:10px;cursor:pointer;display:none}</style>
<script>
addEventListener('DOMContentLoaded',function(){
	var root=document.documentElement;
	var standalone=navigator.standalone||matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches;
	var canFs=root.requestFullscreen||root.webkitRequestFullscreen;
	if(standalone||!canFs)return;
	var b=document.createElement('button');
	b.id='fs-btn';
	b.textContent='⛶';
	b.addEventListener('click',function(){
		try{
			var p=root.requestFullscreen?root.requestFullscreen({navigationUI:'hide'}):root.webkitRequestFullscreen();
			if(p&&p.catch)p.catch(function(){});
		}catch(e){}
	});
	document.body.appendChild(b);
	var wanted=true;
	var upd=function(){b.style.display=(wanted&&!(document.fullscreenElement||document.webkitFullscreenElement))?'block':'none';};
	window.setFsBtn=function(w){wanted=!!w;upd();};
	document.addEventListener('fullscreenchange',upd);
	document.addEventListener('webkitfullscreenchange',upd);
	upd();
});
</script>
<script>
addEventListener('DOMContentLoaded',function(){
	// Trava a orientação em paisagem com a camera a esquerda onde a API
	// existe (Android: PWA instalado ou fullscreen). No iPhone a API nao
	// existe; la fica o aviso do jogo pedindo para virar o aparelho.
	var lock=function(){
		try{
			if(screen.orientation&&screen.orientation.lock){
				var p=screen.orientation.lock('landscape-primary');
				if(p&&p.catch)p.catch(function(){});
			}
		}catch(e){}
	};
	var standalone=navigator.standalone||matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches;
	if(standalone)lock();
	document.addEventListener('fullscreenchange',function(){if(document.fullscreenElement)lock();});
	document.addEventListener('webkitfullscreenchange',function(){if(document.webkitFullscreenElement)lock();});
});
</script>
<script>
// iPad/iPhone congelam a pagina em segundo plano com o main loop do Godot
// parado — o hook de visibilidade em GDScript (Sfx.gd) nunca chega a rodar,
// mas o WebAudio vive na thread de som e a musica continuava tocando,
// duplicando com a instancia nova aberta pelo icone da tela de inicio.
// Suspender o AudioContext aqui, em JS puro, roda no proprio evento,
// antes do congelamento.
(function(){
	var ctxs=[];
	var wrap=function(name){
		var Orig=window[name];
		if(!Orig)return;
		var Wrapped=function(opts){
			var c=new Orig(opts);
			ctxs.push(c);
			return c;
		};
		Wrapped.prototype=Orig.prototype;
		window[name]=Wrapped;
	};
	wrap('AudioContext');
	wrap('webkitAudioContext');
	var each=function(m){
		ctxs.forEach(function(c){
			try{var p=c[m]();if(p&&p.catch)p.catch(function(){});}catch(e){}
		});
	};
	var sync=function(){each(document.hidden?'suspend':'resume');};
	document.addEventListener('visibilitychange',sync);
	addEventListener('pagehide',function(){each('suspend');});
	addEventListener('pageshow',sync);
	// no iOS a retomada as vezes so vale dentro de um gesto do usuario
	document.addEventListener('touchend',function(){if(!document.hidden)each('resume');},true);
})();
</script>

			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12021716,"index.wasm":37685705},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
